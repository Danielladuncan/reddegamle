    <main>
      <h1>INDBERET SOM EVAKUERINGSHJÆLPER</h1>
      <section id="form-section">
        <form>
          <div class="form-group">
            <label for="full_name">Fulde navn</label>
            <input type="text" id="full_name" name="full_name" required />
            <p class="error-message">Please enter a value</p>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required />
            <p class="error-message">Please enter a value</p>
          </div>

          <div class="form-group">
            <label for="number">Telefonnummer</label>
            <input type="number" id="number" name="number" required />
            <p class="error-message">Please enter a value</p>
          </div>

          <div class="form-group">
            <label for="role">Din rolle</label>
            <select id="role">
              <option value="">--Vælg din rolle--</option>
              <option value="helper">Frivillig hjælper</option>
              <option value="personale">Plejepersonale</option>
              <option value="nurse">Sygeplejske</option>
              <option value="family">Pårørende</option>
            </select>
            <p class="error-message">Please enter a value</p>
          </div>

          <div class="form-group">
            <label for="city">By/Område</label>
            <input type="text" id="city" name="city" required />
            <p class="error-message">Please enter a value</p>
          </div>

          <div class="form-group">
            <label for="marks">Evt. bemærkninger</label>
            <textarea name="marks" id="marks" required></textarea>
          </div>

          <div class="form-group">
            <label for="terms">
              <input type="checkbox" id="terms" name="accept_terms" value="yes" required />
              Accepter vilkår
            </label>
          </div>

          <button>Indsend oplysninger</button>
        </form>
